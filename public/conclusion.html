<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auction Conclusion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="conclusion.css">
</head>

<body>

<header>
  <h1>Auction Results</h1>
  <nav class="page-links">
    <a href="index.html">Setup</a>
    <a href="live.html">Live console</a>
    <a href="view.html">Participant view</a>
  </nav>
</header>

<main>
  <p id="conclusion-notice" class="form-msg" hidden></p>

  <!-- Headline statistics -->
  <section>
    <h2>Overview</h2>
    <div id="stats" class="stats-grid"><p class="empty">Loading…</p></div>
  </section>

  <!-- Teams Summary -->
  <section>
    <h2>Teams Summary</h2>
    <div id="summary"></div>
  </section>

  <!-- Sold players -->
  <section>
    <h2>Sold Players</h2>
    <table>
      <thead>
        <tr><th>Player</th><th>Category</th><th>Team</th><th>Price</th></tr>
      </thead>
      <tbody id="sold-list">
        <tr><td colspan="4" class="empty">No sales yet</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Unsold Players -->
  <section>
    <h2>Unsold Players</h2>
    <div id="unsold-players"></div>
  </section>
</main>

<footer>
  <p>© 2026 Sports Auction Platform</p>
</footer>

<script src="shared.js"></script>
<script src="conclusion.js"></script>
</body>
</html>
