<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Auction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="live.css">
</head>

<body>

<header>
  <h1>Sports Auction League</h1>
</header>

<main>

  <!-- TEAMS -->
  <section id="teams">
    <h2>Teams</h2>
    <div id="teams-list"></div>
  </section>

  <!-- LIVE AUCTION -->
  <section id="auction">
    <h2>Live Auction</h2>

    <article id="current-player">
      <img id="auction-player-image" src="" alt="Player Image" width="180">
      <h3 id="auction-player-name">No Player</h3>
      <p>Category: <span id="auction-player-category">—</span></p>
      <p>Highest Bid: ₹<span id="highest-bid">0</span></p>
      <p>Leading Team: <span id="leading-team">—</span></p>
    </article>

    <form id="bidding-form">
      <label>
        Select Team:
        <select id="team-select"></select>
      </label>

      <label>
        Enter Bid:
        <input type="number" id="bid-amount" min="0">
      </label>

      <button type="button" id="place-bid">Place Bid</button>
      <button type="button" id="sell-player">Sell Player</button>
    </form>
  </section>

  <!-- PLAYERS POOL -->
  <section id="players">
    <h2>Players List</h2>
    <div id="players-list"></div>
  </section>

  <!-- RESULTS -->
  <!-- <section id="results">
    <h2>Sold Players</h2>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Category</th>
          <th>Team</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="sold-players"></tbody>
    </table>
  </section> -->

  <!-- END AUCTION BUTTON -->
  <section style="text-align:center; margin: 20px 0;">
    <button id="end-auction-btn">End Auction</button>
  </section>

  <!-- POPUP (PLAYER + TEAM) -->
  <div id="info-popup" class="popup hidden">
    <div class="popup-content">
      <span id="close-popup">×</span>

      <img id="popup-image" src="" alt="Player Image" width="150">

      <h3 id="popup-title"></h3>
      <ul id="popup-list"></ul>

      <div class="popup-nav">
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
      </div>
    </div>
  </div>

</main>

<footer>
  <p>© 2026 Sports Auction Platform</p>
</footer>

<script src="live.js"></script>
</body>
</html>
